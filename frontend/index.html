<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Cart Billing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#007BFF',
                '50': '#E6F2FF',
                '100': '#CCE5FF',
                '200': '#99CBFF',
                '300': '#66B2FF',
                '400': '#3398FF',
                '500': '#007BFF',
                '600': '#0062CC',
                '700': '#004A99',
                '800': '#003166',
                '900': '#001933',
              },
            },
            keyframes: {
              'gate-open': {
                '0%': { transform: 'scaleX(1)' },
                '100%': { transform: 'scaleX(0)' },
              },
              'scan-line': {
                '0%, 100%': { top: '0%' },
                '50%': { top: '100%' },
              },
              'fade-in-down': {
                '0%': { opacity: '0', transform: 'translateY(-20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'gate-open': 'gate-open 1s ease-in-out forwards',
              'scan-line': 'scan-line 2s ease-in-out infinite',
              'fade-in-down': 'fade-in-down 0.8s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.8s ease-out forwards 0.3s',
            },
          }
        }
      }
    </script>
    {/* NEW: Styles for High Contrast Accessibility Mode */}
    <style>
      html.high-contrast body {
        filter: contrast(175%);
        background-color: #fff !important; /* Forces a white background for readability */
      }
      /* Invert the filter on the widget itself so it's not visually affected */
      html.high-contrast .fixed.bottom-5.left-5 {
        filter: contrast(57%); 
      }
      /* Custom scrollbar for trending products */
      .scrollbar-thin {
        scrollbar-width: thin;
        scrollbar-color: #a0aec0 #edf2f7; /* thumb color track color */
      }
      .dark .scrollbar-thin {
         scrollbar-color: #4a5568 #2d3748;
      }
      .scrollbar-thin::-webkit-scrollbar {
        height: 8px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #edf2f7;
        border-radius: 10px;
      }
      .dark .scrollbar-thin::-webkit-scrollbar-track {
        background: #2d3748;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: #a0aec0;
        border-radius: 10px;
        border: 2px solid #edf2f7;
      }
      .dark .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: #4a5568;
        border-color: #2d3748;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.1",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
